name: async-payment-service

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  API_KEY: ${API_KEY:-local-development-key}
  DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
  RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-0.5}
  RABBIT_PUBLISH_TIMEOUT_SECONDS: ${RABBIT_PUBLISH_TIMEOUT_SECONDS:-10}
  PAYMENT_MIN_DELAY_SECONDS: ${PAYMENT_MIN_DELAY_SECONDS:-2.0}
  PAYMENT_MAX_DELAY_SECONDS: ${PAYMENT_MAX_DELAY_SECONDS:-5.0}
  PAYMENT_SUCCESS_RATE: ${PAYMENT_SUCCESS_RATE:-0.9}
  RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-2}
  WEBHOOK_LEASE_SECONDS: ${WEBHOOK_LEASE_SECONDS:-30}
  REQUIRE_HTTPS_WEBHOOKS: ${REQUIRE_HTTPS_WEBHOOKS:-true}
  ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-false}

x-app-service: &app-service
  build:
    context: .
    target: runtime
  image: async-payment-service:local
  environment: *app-environment
  init: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    command:
      - uvicorn
      - payment_service.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  consumer:
    <<: *app-service
    command: ["python", "-m", "payment_service.consumer.app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
