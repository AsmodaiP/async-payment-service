[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "async-payment-service"
version = "0.1.0"
description = "Asynchronous payment processing service with transactional outbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.0,<2",
    "asyncpg>=0.30.0,<1",
    "fastapi>=0.135.0,<0.140",
    "faststream[rabbit]>=0.7.2,<0.8",
    "httpx>=0.28.0,<0.29",
    "pamqp>=4.0.0,<5",
    "pydantic-settings>=2.10.0,<3",
    "sqlalchemy[asyncio]>=2.0.48,<2.1",
    "structlog>=25.4.0,<26",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2",
    "pytest>=8.4.0,<10",
    "pytest-asyncio>=1.1.0,<2",
    "pytest-cov>=6.2.0,<8",
    "respx>=0.22.0,<1",
    "ruff>=0.12.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_service"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["payment_service"]
# These adapters are verified by the Docker e2e scenario instead of in-process coverage.
omit = [
    "src/payment_service/consumer/app.py",
    "src/payment_service/db/session.py",
    "src/payment_service/messaging/outbox.py",
    "src/payment_service/testing/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["payment_service"]

[[tool.mypy.overrides]]
module = ["faststream.*"]
ignore_missing_imports = true
